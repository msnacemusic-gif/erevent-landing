# Автоматическая выкладка сайта на хостинг Timeweb по FTP.
# Срабатывает на каждый пуш в main, а также вручную — кнопкой Run workflow
# на вкладке Actions.
#
# Доступы лежат в секретах репозитория (Settings → Secrets and variables →
# Actions): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD. В коде их нет.
name: Деплой на Timeweb

on:
  push:
    branches: [main]
  workflow_dispatch:

# Одновременно идёт только одна выкладка: два параллельных заливки
# перетёрли бы файлы друг друга.
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Залить файлы сайта на FTP
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Залить по FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Timeweb принимает обычный FTP. Если в панели хостинга включён
          # FTPS — поменяйте на ftps.
          protocol: ftp
          port: 21
          local-dir: ./
          # FTP-сервер отсчитывает путь от домашней папки аккаунта, поэтому
          # путь короткий. Полный путь на сервере — /home/c/co522702/sobroom/public_html/,
          # но если написать его целиком, внутри создастся вложенная копия.
          server-dir: /sobroom/public_html/
          # Действие сравнивает файлы с прошлой выкладкой и заливает только
          # изменённые.
          # Служебное на сервер не уезжает. .htaccess под исключения
          # не попадает — он нужен хостингу, чтобы отдавать index.html.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/*.md
            chats/**
            project/**
            serverless/**

      # Проверка после выкладки: перебрасывает ли http на https, открываются
      # ли страницы и отдаются ли иконки. Шаг не роняет выкладку.
      - name: Проверить сайт
        continue-on-error: true
        run: |
          set +e
          echo "== переход с http на https"
          curl -sS --max-time 30 -o /dev/null -D /tmp/head http://sobroom.ru/
          head -1 /tmp/head
          grep -i '^location:' /tmp/head
          final=$(curl -sSL --max-time 40 --max-redirs 5 -o /dev/null \
                    -w '%{http_code} %{url_effective}' http://sobroom.ru/)
          echo "после переходов: $final"
          case "$final" in
            "200 https://sobroom.ru/") echo "OK: http перебрасывает на https" ;;
            *) echo "ВНИМАНИЕ: редирект не сработал или зациклился" ;;
          esac
          echo
          echo "== страницы и файлы"
          fail=0
          for path in / /art-obekty/ /mebel-oborudovanie/ /keitering/ \
                      /ekrany-svet-zvuk/ /privacy/ /styles.css /script.js \
                      /favicon.ico /media/favicon-32.png /media/favicon-16.png \
                      /media/apple-touch-icon.png; do
            out=$(curl -sSL --max-time 30 -o /dev/null \
                    -w '%{http_code} %{content_type}' "https://sobroom.ru$path")
            echo "$path -> $out"
            case "$out" in 200*) ;; *) fail=1 ;; esac
          done
          echo
          curl -sSL --max-time 30 -o page.html https://sobroom.ru/
          if grep -q 'СОБЫТИЯ РУМ' page.html && [ "$fail" = "0" ]; then
            echo "OK: сайт открывается, все файлы на месте"
          else
            echo "ВНИМАНИЕ: что-то отвечает не так — смотрите коды выше"
          fi
