# Автоматическая выкладка сайта на хостинг Timeweb по FTP.
# Срабатывает на каждый пуш в main, а также вручную — кнопкой Run workflow
# на вкладке Actions.
#
# Доступы лежат в секретах репозитория (Settings → Secrets and variables →
# Actions): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD. В коде их нет.
name: Деплой на Timeweb

on:
  push:
    branches: [main]
  workflow_dispatch:

# Одновременно идёт только одна выкладка: два параллельных заливки
# перетёрли бы файлы друг друга.
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Залить файлы сайта на FTP
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      # Настройки приёмника заявок собираются из секретов репозитория.
      # В репозитории их нет: файл создаётся здесь и уезжает вместе с сайтом.
      # Значения передаются в base64, чтобы кавычки и спецсимволы в пароле
      # не сломали синтаксис PHP.
      - name: Собрать настройки приёмника заявок
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          LEADS_USER: ${{ secrets.LEADS_USER }}
          LEADS_PASS: ${{ secrets.LEADS_PASS }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          b64 () { printf '%s' "$1" | base64 -w0; }
          {
            echo "<?php"
            echo "// Файл собран выкладкой из секретов репозитория. Не редактировать вручную."
            echo "return ["
            echo "    'db_host' => base64_decode('$(b64 "${DB_HOST:-localhost}")'),"
            echo "    'db_name' => base64_decode('$(b64 "$DB_NAME")'),"
            echo "    'db_user' => base64_decode('$(b64 "$DB_USER")'),"
            echo "    'db_pass' => base64_decode('$(b64 "$DB_PASS")'),"
            echo "    'bot_token' => base64_decode('$(b64 "$BOT_TOKEN")'),"
            echo "    'chat_id' => base64_decode('$(b64 "$CHAT_ID")'),"
            echo "    'mail_host' => base64_decode('$(b64 "${MAIL_HOST:-smtp.timeweb.ru}")'),"
            echo "    'mail_port' => ${MAIL_PORT:-465},"
            echo "    'mail_user' => base64_decode('$(b64 "$MAIL_USER")'),"
            echo "    'mail_pass' => base64_decode('$(b64 "$MAIL_PASS")'),"
            echo "    'mail_to' => base64_decode('$(b64 "$MAIL_TO")'),"
            echo "    'leads_user' => base64_decode('$(b64 "$LEADS_USER")'),"
            echo "    'leads_pass' => base64_decode('$(b64 "$LEADS_PASS")'),"
            echo "    'cron_key' => base64_decode('$(b64 "$CRON_KEY")'),"
            echo "    'site' => 'https://sobroom.ru',"
            echo "];"
          } > form/config.php
          php -l form/config.php || true
          missing=""
          for name in DB_NAME DB_USER DB_PASS BOT_TOKEN CHAT_ID MAIL_USER MAIL_PASS MAIL_TO LEADS_USER LEADS_PASS; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "ВНИМАНИЕ: не заданы секреты:$missing"
            echo "Пока их нет, заявки пишутся в запасной журнал на сервере."
          else
            echo "Все секреты на месте."
          fi

      - name: Залить по FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Timeweb принимает обычный FTP. Если в панели хостинга включён
          # FTPS — поменяйте на ftps.
          protocol: ftp
          port: 21
          local-dir: ./
          # FTP-сервер отсчитывает путь от домашней папки аккаунта, поэтому
          # путь короткий. Полный путь на сервере — /home/c/co522702/sobroom/public_html/,
          # но если написать его целиком, внутри создастся вложенная копия.
          server-dir: /sobroom/public_html/
          # Действие сравнивает файлы с прошлой выкладкой и заливает только
          # изменённые.
          # Служебное на сервер не уезжает. .htaccess под исключения
          # не попадает — он нужен хостингу, чтобы отдавать index.html.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/*.md
            chats/**
            project/**
            serverless/**

      # Временный шаг: показывает, что отвечают Telegram и почтовый сервер.
      # Убирается, как только уведомления заработают.
      - name: Диагностика уведомлений
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          LEADS_USER: ${{ secrets.LEADS_USER }}
          LEADS_PASS: ${{ secrets.LEADS_PASS }}
        run: |
          set +e
          curl -sS --max-time 90 -u "$LEADS_USER:$LEADS_PASS" \
            https://sobroom.ru/form/diag.php

      # Проверка после выкладки: перебрасывает ли http на https, открываются
      # ли страницы и отдаются ли иконки. Шаг не роняет выкладку.
      - name: Проверить сайт
        continue-on-error: true
        run: |
          set +e
          echo "== переход с http на https"
          curl -sS --max-time 30 -o /dev/null -D /tmp/head http://sobroom.ru/
          head -1 /tmp/head
          grep -i '^location:' /tmp/head
          final=$(curl -sSL --max-time 40 --max-redirs 5 -o /dev/null \
                    -w '%{http_code} %{url_effective}' http://sobroom.ru/)
          echo "после переходов: $final"
          case "$final" in
            "200 https://sobroom.ru/") echo "OK: http перебрасывает на https" ;;
            *) echo "ВНИМАНИЕ: редирект не сработал или зациклился" ;;
          esac
          echo
          echo "== страницы и файлы"
          fail=0
          for path in / /art-obekty/ /mebel-oborudovanie/ /keitering/ \
                      /ekrany-svet-zvuk/ /privacy/ /styles.css /script.js \
                      /favicon.ico /media/favicon-32.png /media/favicon-16.png \
                      /media/apple-touch-icon.png; do
            out=$(curl -sSL --max-time 30 -o /dev/null \
                    -w '%{http_code} %{content_type}' "https://sobroom.ru$path")
            echo "$path -> $out"
            case "$out" in 200*) ;; *) fail=1 ;; esac
          done
          echo
          echo "== приёмник заявок"
          # Заявка без телефона и почты: обработчик обязан её отклонить.
          # В базу при этом ничего не пишется — лишних записей не появится.
          out=$(curl -sS --max-time 30 -w '\n%{http_code}' \
                  -F 'name=Проверка выкладки' https://sobroom.ru/form/submit.php)
          echo "$out" | tail -2
          case "$(echo "$out" | tail -1)" in
            422) echo "OK: обработчик работает и проверяет контакты" ;;
            *) echo "ВНИМАНИЕ: обработчик отвечает не так, как ожидалось" ;;
          esac

          # Отметку «уведомление доставлено» принимаем только с подписью,
          # которую выдал приёмник. Чужая отметка обязана отлетать.
          code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
                   -F 'id=1' -F 'token=подделка' https://sobroom.ru/form/notified.php)
          case "$code" in
            403) echo "OK: отметку о доставке без подписи не принимают" ;;
            *) echo "ВНИМАНИЕ: form/notified.php ответил $code вместо 403" ;;
          esac

          echo
          echo "== приёмник уведомлений на Cloudflare"
          # Уведомление в Telegram отправляет браузер посетителя, а браузер
          # читает ответ чужого адреса только с разрешением. Без него заявка
          # навсегда останется в очереди с пометкой «ждёт».
          allow=$(curl -sS --max-time 30 -o /dev/null -D - -X OPTIONS \
                    -H 'Origin: https://sobroom.ru' \
                    -H 'Access-Control-Request-Method: POST' \
                    https://lingering-credit-51ce.msnace-music.workers.dev/ \
                  | tr -d '\r' | awk 'tolower($1) == "access-control-allow-origin:" { print $2 }')
          case "$allow" in
            '*'|https://sobroom.ru) echo "OK: браузеру с sobroom.ru разрешено ($allow)" ;;
            '') echo "ВНИМАНИЕ: разрешения нет — браузер не узнает, дошло ли уведомление" ;;
            *) echo "ВНИМАНИЕ: разрешено только $allow — нужен https://sobroom.ru" ;;
          esac

          echo
          echo "== закрытые адреса"
          for path in /form/config.php /form/lib.php /form/fallback/leads.jsonl \
                      /zayavki-pzned3/; do
            code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "https://sobroom.ru$path")
            case "$path:$code" in
              /zayavki-pzned3/:401) echo "$path -> $code (просит пароль — верно)" ;;
              /zayavki-pzned3/:200) echo "$path -> $code ВНИМАНИЕ: страница заявок открыта без пароля" ;;
              /zayavki-pzned3/:*) echo "$path -> $code ВНИМАНИЕ: страница заявок не открывается" ;;
              *:403|*:404) echo "$path -> $code (закрыт — верно)" ;;
              *) echo "$path -> $code ВНИМАНИЕ: файл отдаётся наружу" ;;
            esac
          done

          echo
          echo "== смешанное содержимое: ищем http:// в отданных файлах"
          mixed=0
          for f in / /styles.css /script.js /page.css /art-obekty/ /privacy/ \
                   /privacy/privacy.css; do
            hits=$(curl -sSL --max-time 30 "https://sobroom.ru$f" \
                   | grep -oE 'http://[^"'"'"'` )]+' | sort -u)
            if [ -n "$hits" ]; then
              echo "$f:"
              echo "$hits" | sed 's/^/    /'
              mixed=1
            fi
          done
          if [ "$mixed" = "0" ]; then
            echo "OK: ссылок по http в отданных файлах нет"
          else
            echo "ВНИМАНИЕ: найдены ссылки по http — они и дают «не защищено»"
          fi

          echo
          curl -sSL --max-time 30 -o page.html https://sobroom.ru/
          if grep -q 'СОБЫТИЯ РУМ' page.html && [ "$fail" = "0" ]; then
            echo "OK: сайт открывается, все файлы на месте"
          else
            echo "ВНИМАНИЕ: что-то отвечает не так — смотрите коды выше"
          fi
