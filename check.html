<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Проверка отправки заявок — СОБЫТИЯ РУМ</title>
<style>
  body{margin:0;padding:32px 20px;background:#e8ebe6;color:#0e0f0c;
       font:16px/1.55 'Inter',system-ui,-apple-system,sans-serif}
  .wrap{max-width:720px;margin:0 auto}
  h1{margin:0 0 8px;font-size:26px;letter-spacing:-.02em}
  p.sub{margin:0 0 28px;color:#454745}
  .card{background:#fff;border-radius:24px;padding:24px;margin-bottom:16px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
       background:#e8ebe6;padding:2px 6px;border-radius:6px;word-break:break-all}
  button{appearance:none;border:none;cursor:pointer;background:#9fe870;color:#0e0f0c;
         font:600 16px/1 'Inter',system-ui,sans-serif;padding:16px 28px;border-radius:9999px}
  button[disabled]{opacity:.5;cursor:default}
  .verdict{margin-top:16px;padding:20px;border-radius:16px;display:none}
  .verdict.show{display:block}
  .ok{background:#e2f6d5}
  .bad{background:#ffe4e5}
  .verdict h2{margin:0 0 8px;font-size:18px}
  .verdict ul{margin:8px 0 0;padding-left:20px}
  pre{margin:16px 0 0;padding:16px;background:#0e0f0c;color:#e8ebe6;border-radius:12px;
      font-size:12px;line-height:1.5;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <h1>Проверка отправки заявок</h1>
  <p class="sub">Служебная страница. Отправляет тестовую заявку на приёмник
     и показывает, что он ответил.</p>

  <div class="card">
    <p style="margin:0 0 4px"><b>Приёмник:</b></p>
    <p style="margin:0 0 20px"><code id="endpoint"></code></p>
    <button id="go">Отправить тестовую заявку</button>
    <div class="verdict" id="verdict"></div>
    <pre id="raw" hidden></pre>
  </div>
</div>

<script>
(function () {
  // Тот же адрес, что и в script.js.
  var ENDPOINT = 'https://lingering-credit-51ce.msnace-music.workers.dev/';

  var go = document.getElementById('go');
  var verdict = document.getElementById('verdict');
  var raw = document.getElementById('raw');
  document.getElementById('endpoint').textContent = ENDPOINT;

  function show(cls, title, lines, dump) {
    verdict.className = 'verdict show ' + cls;
    verdict.innerHTML = '<h2>' + title + '</h2><ul><li>' + lines.join('</li><li>') + '</li></ul>';
    raw.hidden = false;
    raw.textContent = dump;
  }

  go.addEventListener('click', function () {
    go.disabled = true;
    go.textContent = 'Отправляем…';
    verdict.className = 'verdict';
    raw.hidden = true;

    var fd = new FormData();
    fd.append('name', 'Тестовая заявка');
    fd.append('phone', '+7 (963) 699-72-95');
    fd.append('email', 'test@example.com');
    fd.append('when', 'проверка связи');
    fd.append('channel', 'Telegram');
    fd.append('comment', 'Это проверка со страницы check.html. Если сообщение дошло — форма настроена верно.');
    fd.append('page', 'check.html — ' + location.href);

    var status = null;
    fetch(ENDPOINT, { method: 'POST', body: fd })
      .then(function (res) {
        status = res.status;
        return res.text();
      })
      .then(function (body) {
        var dump = 'HTTP ' + status + '\n\n' + body;
        if (status === 200 && body.indexOf('"ok":true') !== -1) {
          show('ok', 'Приёмник принял заявку', [
            'Проверьте Telegram — сообщение должно быть в @Ereventbot_bot.',
            'Если в боте пусто, а здесь всё зелёное — неверный CHAT_ID либо вы не нажали боту «Старт».'
          ], dump);
        } else if (status === 500 && body.indexOf('not_configured') !== -1) {
          show('bad', 'В воркере не заданы переменные', [
            'В Cloudflare нет BOT_TOKEN или CHAT_ID.',
            'Settings → Variables and Secrets → добавить оба.',
            'После добавления обязательно нажать Deploy ещё раз.'
          ], dump);
        } else if (status === 502) {
          show('bad', 'Воркер не смог отправить в Telegram', [
            'Токен неверный или отозван — впишите действующий в BOT_TOKEN.',
            'Либо CHAT_ID не тот, либо вы не нажали боту «Старт».',
            'Точную причину видно в Cloudflare → Worker → Logs.'
          ], dump);
        } else if (status === 405 || body.indexOf('Hello World') !== -1) {
          show('bad', 'В воркере всё ещё стоит чужой код', [
            'Похоже, код telegram-relay.js не вставлен или не задеплоен.',
            'Edit code → вставить файл целиком → Deploy.'
          ], dump);
        } else {
          show('bad', 'Неожиданный ответ приёмника', [
            'Пришлите этот текст — разберёмся.'
          ], dump);
        }
      })
      .catch(function (e) {
        show('bad', 'Запрос вообще не дошёл до приёмника', [
          'Чаще всего это ALLOW_ORIGIN: там должно быть ровно <code>https://msnacemusic-gif.github.io</code> — без «/erevent-landing» и без слэша в конце.',
          'Либо воркер не задеплоен и адрес не отвечает.',
          'Ещё вариант — блокировщик рекламы в браузере; попробуйте в режиме инкогнито.'
        ], 'Ошибка сети или CORS: ' + e);
      })
      .then(function () {
        go.disabled = false;
        go.textContent = 'Отправить ещё раз';
      });
  });
})();
</script>
</body>
</html>
